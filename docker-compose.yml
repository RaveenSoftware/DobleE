version: '3.8'

services:
  db:
    image: 'postgres:15-alpine'
    restart: always
    environment:
      POSTGRES_DB: doblee
      POSTGRES_USER: doblee_user
      POSTGRES_PASSWORD: DobleE2026!
    volumes:
      - 'pgdata:/var/lib/postgresql/data'

  backend:
    build:
      context: ./backend
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: 'postgres://doblee_user:DobleE2026!@db:5432/doblee'
      JWT_SECRET: doblee_jwt_secret_prod_2026
      PORT: 5000

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: always
    depends_on:
      - backend

volumes:
  pgdata:
