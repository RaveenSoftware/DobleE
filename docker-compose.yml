version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: doblee_postgres
    environment:
      POSTGRES_USER: doblee_user
      POSTGRES_PASSWORD: doblee_password
      POSTGRES_DB: doblee_db
    ports:
      - "5432:5432"
    volumes:
      - doblee_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  doblee_pgdata:
